<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تأكيد الطلب - كعكوز إكسبرس</title>
<link rel="stylesheet" href="style.css">
<!-- استيراد خط أنيق وعصري من Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>

<body>

<div class="checkout-container">

<header class="checkout-header">
    <div class="brand-icon">🍞</div>
    <h1>تأكيد الطلب</h1>
    <p>خطوة واحدة تفصلك عن الاستمتاع بوجبتك الساخنة!</p>
</header>

<!-- القسم الأول: معلومات العميل -->
<div class="section-card">
    <h3>👤 معلومات التواصل</h3>
    <div class="input-group">
        <span class="input-icon">الاسم</span>
        <input type="text" id="customerName" placeholder="الاسم الكامل">
    </div>
    <div class="input-group">
        <span class="input-icon">الهاتف</span>
        <input type="tel" id="customerPhone" placeholder="07xxxxxxxx">
    </div>
</div>

<!-- القسم الثاني: طريقة الاستلام -->
<div class="section-card">
    <h3>🛵 طريقة الاستلام</h3>
    
    <div class="delivery-grid">
        <label class="delivery-card">
            <input type="radio" name="delivery" value="استلام من المحل" checked>
            <div class="card-content">
                <span class="card-emoji">🏪</span>
                <span class="card-title">استلام من المحل</span>
                <span class="card-sub">جاهز خلال 10 دقائق</span>
            </div>
        </label>

        <label class="delivery-card">
            <input type="radio" name="delivery" value="توصيل">
            <div class="card-content">
                <span class="card-emoji">🛵</span>
                <span class="card-title">توصيل منزلي</span>
                <span class="card-sub">يصلك حتى باب البيت</span>
            </div>
        </label>
    </div>

    <!-- حقول التوصيل (تظهر عند اختيار توصيل) -->
    <div id="addressFields" class="address-box" style="display: none;">
        <label for="deliveryZone">اختر منطقة التوصيل:</label>
        <select id="deliveryZone">
            <option value="" selected disabled>-- اختر المنطقة --</option>
            <option value="وسط المدينة / الميدان / القلعة / المنشية" data-price="1.00">وسط المدينة، الميدان، القلعة، المنشية (1.00 دج)</option>
            <option value="العيزرية / الجدعة / وادي الأكراد" data-price="1.00">العيزرية، الجدعة، وادي الأكراد (1.00 دج)</option>
            <option value="حي السلالم / الصافح والبقيع / سواده" data-price="1.50">حي السلالم، الصافح والبقيع، سواده (1.50 دج)</option>
            <option value="كفر هودا / المصلى / أم خروبة" data-price="1.50">كفر هودا، المصلى، أم خروبة (1.50 دج)</option>
            <option value="حي السرو / المهندسين / الدبابنة" data-price="1.50">حي السرو، المهندسين، الدبابنة (1.50 دج)</option>
            <option value="منطقة زي / بطنا" data-price="2.00">منطقة زي، بطنا (2.00 دج)</option>
            <option value="النبي يوشع / سلجوف" data-price="2.00">النبي يوشع، سلجوف (2.00 دج)</option>
            <option value="علان وأم جوزة / الرميمين" data-price="2.50">علان وأم جوزة، الرميمين (2.50 دج)</option>
            <option value="منطقة أخرى" data-price="">منطقة أخرى (يتم تحديد السعر لاحقاً)</option>
        </select>

        <input type="text" id="customerStreet" placeholder="اسم الشارع، رقم البناية، أو أقرب معلم بارز">

        <div class="location-tip">
            <span>📍</span>
            <p>عند تحويلك للواتساب، أرسل موقعك (لوكيشن) 📎 لضمان وصول الطلب بدقة.</p>
        </div>
    </div>
</div>

<!-- القسم الثالث: ملخص الفاتورة -->
<div class="section-card invoice-card">
    <h3>💰 تفاصيل الفاتورة</h3>
    <div class="invoice-row">
        <span>قيمة الوجبات:</span>
        <span id="summaryItemsTotal">0.00 دينار</span>
    </div>
    <div id="summaryDeliveryRow" class="invoice-row" style="display: none;">
        <span>رسوم التوصيل:</span>
        <span id="summaryDeliveryFee">0.00 دينار</span>
    </div>
    <hr class="invoice-divider">
    <div class="invoice-row total-row">
        <span>المجموع النهائي:</span>
        <span id="summaryGrandTotal">0.00 دينار</span>
    </div>
</div>

<!-- القسم الرابع: ملاحظات -->
<div class="section-card">
    <h3>📝 ملاحظات إضافية</h3>
    <textarea id="customerNotes" placeholder="مثال: بدون صوص حار، زيادة إكسترا... (اختياري)"></textarea>
</div>

<!-- زر إرسال الطلب الاحترافي -->
<button id="confirmOrder" class="premium-order-btn">
    <span>إرسال الطلب عبر واتساب</span>
    <span class="btn-icon">💬</span>
</button>

</div>

<script src="checkout.js"></script>
</body>
</html>
