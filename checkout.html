<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تأكيد الطلب - كعكوز إكسبرس</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>

<body>

<!-- إضاءة الزوايا الأربعة للصفحة -->
<div class="corner-glow top-right"></div>
<div class="corner-glow top-left"></div>
<div class="corner-glow bottom-right"></div>
<div class="corner-glow bottom-left"></div>

<div class="checkout-container">

<header class="checkout-header">
    <!-- شعار مطعم كعكوز إكسبرس متناسق مع عرض الصفحة -->
    <div class="logo-wrapper">
        <img src="file_000000002fb88246aa372015b20cd607.png" alt="شعار كعكوز إكسبرس" class="brand-logo-img">
    </div>
    <h1>تأكيد الطلب</h1>
    <p>أدخل بياناتك لتصلك وجبتك الساخنة وطازجة!</p>
</header>

<!-- القسم الأول: معلومات العميل -->
<div class="section-card">
    <h3>👤 معلومات التواصل</h3>
    <div class="input-group">
        <input type="text" id="customerName" placeholder="الاسم الكامل">
    </div>
    <div class="input-group">
        <input type="tel" id="customerPhone" placeholder="رقم الهاتف (07xxxxxxxx)">
    </div>
</div>

<!-- القسم الثاني: طريقة الاستلام -->
<div class="section-card">
    <h3>🛵 طريقة الاستلام</h3>
    
    <div class="delivery-grid">
        <label class="delivery-card">
            <input type="radio" name="delivery" value="استلام من المحل" checked>
            <div class="card-content">
                <span class="card-emoji">🏪</span>
                <span class="card-title">استلام من المحل</span>
                <span class="card-sub">جاهز خلال 10 دقائق</span>
            </div>
        </label>

        <label class="delivery-card">
            <input type="radio" name="delivery" value="توصيل">
            <div class="card-content">
                <span class="card-emoji">🛵</span>
                <span class="card-title">توصيل منزلي</span>
                <span class="card-sub">يصلك حتى باب البيت</span>
            </div>
        </label>
    </div>

    <!-- حقول التوصيل -->
    <div id="addressFields" class="address-box" style="display: none;">
        <label for="deliveryZone">اختر منطقة التوصيل:</label>
        <select id="deliveryZone">
            <option value="" selected disabled>-- اختر المنطقة --</option>
            <option value="وسط المدينة / حنينا / درب السرايا" data-price="1.00">وسط المدينة / حنينا / درب السرايا - 1 دينار</option>
            <option value="شارع الستين / ضاحية الحسين / القلعة" data-price="1.50">شارع الستين / ضاحية الحسين / القلعة - 1.50 دينار</option>
            <option value="زي / أم جوزة / البيوضة" data-price="2.00">زي / أم جوزة / البيوضة - 2 دينار</option>
            <option value="منطقة أخرى" data-price="">منطقة أخرى (يرجى التواصل أولاً)</option>
        </select>

        <input type="text" id="customerStreet" placeholder="اسم الشارع، رقم البناية، وأقرب معلم">

        <div class="location-tip">
            <span>📍</span>
            <p>عند تحويلك للواتساب، أرسل موقعك (لوكيشن) 📎 من علامة المرفقات لتسهيل التوصيل بدقة.</p>
        </div>
    </div>
</div>

<!-- القسم الثالث: تفاصيل الفاتورة -->
<div class="section-card invoice-card">
    <h3>💰 تفاصيل الفاتورة</h3>
    <div class="invoice-row">
        <span>قيمة الوجبات:</span>
        <span id="summaryItemsTotal">0.00 دينار</span>
    </div>
    <div id="summaryDeliveryRow" class="invoice-row" style="display: none;">
        <span>رسوم التوصيل:</span>
        <span id="summaryDeliveryFee">0.00 دينار</span>
    </div>
    <hr class="invoice-divider">
    <div class="invoice-row total-row">
        <span>المجموع النهائي:</span>
        <span id="summaryGrandTotal">0.00 دينار</span>
    </div>
</div>

<!-- القسم الرابع: ملاحظات -->
<div class="section-card">
    <h3>📝 ملاحظات إضافية</h3>
    <textarea id="customerNotes" placeholder="ملاحظات على الطلب (اختياري)"></textarea>
</div>

<!-- زر إرسال الطلب -->
<button id="confirmOrder" class="premium-order-btn">
    <span>متابعة إرسال الطلب</span>
    <span class="btn-icon">✅</span>
</button>

</div>

<script src="checkout.js"></script>
</body>
</html>
