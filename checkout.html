<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تأكيد الطلب - كعكوز إكسبرس</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

</head>

<body>

<header class="sandwich-header">
<h1>📋 تأكيد الطلب</h1>
<p>يرجى تعبئة البيانات قبل إرسال الطلب.</p>
</header>

<div class="checkout-box">

<input type="text" id="customerName" placeholder="الاسم الكامل">

<input type="tel" id="customerPhone" placeholder="رقم الهاتف">

<div id="addressFields">

<input type="text" id="customerArea" placeholder="المنطقة">

<input type="text" id="customerStreet" placeholder="الشارع">

</div>

<div id="locationBox" style="display:none;">



<p id="locationStatus"></p>

<h3 style="margin-top:20px;">
أو اختر موقعك من الخريطة
</h3>

<div id="map"></div>

</div>

<textarea id="customerNotes" placeholder="ملاحظات على الطلب (اختياري)"></textarea>

<h3>طريقة الاستلام</h3>

<div class="delivery-options">

<label class="delivery-card">
<input type="radio" name="delivery" value="استلام من المحل" checked>
🏪 استلام من المحل
</label>

<label class="delivery-card">
<input type="radio" name="delivery" value="توصيل">
🛵 توصيل
</label>

</div>

<button id="confirmOrder" class="order-btn">
✅ متابعة إرسال الطلب
</button>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="checkout.js"></script>

</body>

</html>
